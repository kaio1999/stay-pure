name: StayPure
options:
  bundleIdPrefix: com.staypure
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  StayPure:
    type: application
    platform: iOS
    sources:
      - path: StayPure
      - path: Shared
    resources:
      - path: StayPure/Resources
    entitlements:
      path: StayPure/StayPure.entitlements
    info:
      path: StayPure/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.staypure.app
      INFOPLIST_KEY_CFBundleDisplayName: Stay Pure
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: StayPureTunnel
        embed: true
  StayPureTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: StayPureTunnel
      - path: Shared
    resources:
      - path: StayPure/Resources
    entitlements:
      path: StayPureTunnel/StayPureTunnel.entitlements
    info:
      path: StayPureTunnel/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.staypure.app.tunnel
      INFOPLIST_KEY_CFBundleDisplayName: Stay Pure Tunnel
